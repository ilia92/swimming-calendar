<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6fa4">
<title>Плувен календар</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <a class="brand" href="#/"><span class="logo" aria-hidden="true">🏊</span><span id="brand-text"></span></a>
  <nav id="nav" class="nav"></nav>
  <div class="top-actions">
    <button id="credits-pill" class="pill" type="button" hidden></button>
    <button id="settings-btn" class="btn ghost small icon" type="button" hidden>⚙</button>
    <div id="lang-flags" class="flags">
      <button type="button" data-lang="bg" title="Български"><img src="/flags/bg.svg" alt="BG"></button>
      <button type="button" data-lang="en" title="English"><img src="/flags/gb.svg" alt="EN"></button>
    </div>
    <button id="theme-toggle" class="btn ghost small icon" type="button" aria-label="theme">◐</button>
    <button id="account-btn" class="btn ghost small" type="button"></button>
  </div>
</header>
<main id="app" class="app"></main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<dialog id="confirm" class="confirm"></dialog>
<script src="/app.js"></script>
</body>
</html>
